<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare AI Roles — Side by Side</title>
    <meta name="description" content="Compare AI career roles: skills, salary, career paths, and growth opportunities side by side.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #1DB368; --green-dk: #0D8A4E; --forest: #0D3D28;
            --bg: #F2FAF6; --surface: #FFFFFF; --mint: #EAF7F0;
            --border: #C5E8D5; --text: #0D3D28; --muted: #5A8A70;
        }
        [data-theme="dark"] {
            --green: #2EE383; --green-dk: #1FC46D; --forest: #E8F5F0;
            --bg: #0D3D28; --surface: #1A5F42; --mint: #0F6B47;
            --border: #2E8A5F; --text: #E8F5F0; --muted: #A8D5BA;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .nav-logo { font-size: 20px; font-weight: 500; color: var(--forest); text-decoration: none; }
        .nav-logo span { color: var(--green); }
        .theme-toggle { background: none; border: none; font-size: 20px; cursor: pointer; }
        h1 { font-size: 2rem; margin-bottom: 2rem; color: var(--forest); }
        .selector { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; margin-bottom: 2rem; align-items: end; }
        select { padding: 10px; border: 0.5px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--text); }
        .vs-text { text-align: center; font-size: 20px; color: var(--muted); }
        .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .role-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 24px; }
        .role-header { border-bottom: 0.5px solid var(--border); padding-bottom: 16px; margin-bottom: 16px; }
        .role-title { font-size: 18px; font-weight: 500; color: var(--forest); }
        .role-category { font-size: 11px; color: var(--green-dk); text-transform: uppercase; }
        .section { margin-bottom: 20px; }
        .section-title { font-size: 12px; font-weight: 600; color: var(--green-dk); text-transform: uppercase; margin-bottom: 10px; }
        .item { font-size: 13px; color: var(--muted); padding: 6px 0; display: flex; align-items: start; gap: 8px; }
        .check { color: var(--green); font-weight: bold; }
        @media (max-width: 900px) { .comparison { grid-template-columns: 1fr; } .selector { grid-template-columns: 1fr; } .vs-text { order: -1; margin-bottom: 10px; } }
    </style>
</head>
<body>

<nav>
    <a href="/" class="nav-logo">Resume<span>Link</span></a>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</nav>

<div class="container">
    <h1>Compare AI Roles</h1>

    <div class="selector">
        <div>
            <label style="display: block; margin-bottom: 5px; font-size: 12px; color: var(--muted);">Role 1</label>
            <select id="role1" onchange="updateComparison()">
                <option value="">Select role...</option>
            </select>
        </div>
        <div class="vs-text">VS</div>
        <div>
            <label style="display: block; margin-bottom: 5px; font-size: 12px; color: var(--muted);">Role 2</label>
            <select id="role2" onchange="updateComparison()">
                <option value="">Select role...</option>
            </select>
        </div>
    </div>

    <div class="comparison" id="comparison"></div>
</div>

<script>
const roles = {
    "engineer": { title: "AI Engineer", category: "Engineering", skills: ["Python", "ML frameworks", "System design"], salary: "$150-250k", path: "IC → Senior → Staff", growth: "High" },
    "data": { title: "Data Scientist", category: "Data", skills: ["Statistics", "Python/R", "ML modeling"], salary: "$120-200k", path: "Junior → Senior → Lead", growth: "High" },
    "business": { title: "AI Business Lead", category: "Business", skills: ["Strategy", "Communication", "AI basics"], salary: "$130-220k", path: "Manager → Director → VP", growth: "Very High" },
    "security": { title: "AI Security Analyst", category: "Security", skills: ["Penetration testing", "ML security", "Risk modeling"], salary: "$140-210k", path: "Analyst → Senior → Manager", growth: "High" },
    "ethics": { title: "AI Ethics Officer", category: "Ethics", skills: ["Policy", "Philosophy", "Communication"], salary: "$110-180k", path: "Officer → Senior → Director", growth: "Medium" },
};

function updateComparison() {
    const r1 = document.getElementById('role1').value;
    const r2 = document.getElementById('role2').value;
    const comp = document.getElementById('comparison');

    if (!r1 || !r2) {
        comp.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--muted);">Select two roles to compare</p>';
        return;
    }

    const role1 = roles[r1];
    const role2 = roles[r2];

    comp.innerHTML = `
        <div class="role-panel">
            <div class="role-header">
                <div class="role-title">${role1.title}</div>
                <div class="role-category">${role1.category}</div>
            </div>
            <div class="section">
                <div class="section-title">💰 Salary Range</div>
                <div class="item"><span class="check">→</span> ${role1.salary}</div>
            </div>
            <div class="section">
                <div class="section-title">🛠️ Key Skills</div>
                ${role1.skills.map(s => `<div class="item"><span class="check">✓</span> ${s}</div>`).join('')}
            </div>
            <div class="section">
                <div class="section-title">📈 Career Path</div>
                <div class="item"><span class="check">→</span> ${role1.path}</div>
            </div>
            <div class="section">
                <div class="section-title">🚀 Growth Potential</div>
                <div class="item"><span class="check">→</span> ${role1.growth}</div>
            </div>
            <a href="/roles/${r1}/" style="display: inline-block; margin-top: 16px; padding: 10px 16px; background: var(--forest); color: var(--bg); text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: 500;">Read Full Guide →</a>
        </div>
        <div class="role-panel">
            <div class="role-header">
                <div class="role-title">${role2.title}</div>
                <div class="role-category">${role2.category}</div>
            </div>
            <div class="section">
                <div class="section-title">💰 Salary Range</div>
                <div class="item"><span class="check">→</span> ${role2.salary}</div>
            </div>
            <div class="section">
                <div class="section-title">🛠️ Key Skills</div>
                ${role2.skills.map(s => `<div class="item"><span class="check">✓</span> ${s}</div>`).join('')}
            </div>
            <div class="section">
                <div class="section-title">📈 Career Path</div>
                <div class="item"><span class="check">→</span> ${role2.path}</div>
            </div>
            <div class="section">
                <div class="section-title">🚀 Growth Potential</div>
                <div class="item"><span class="check">→</span> ${role2.growth}</div>
            </div>
            <a href="/roles/${r2}/" style="display: inline-block; margin-top: 16px; padding: 10px 16px; background: var(--forest); color: var(--bg); text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: 500;">Read Full Guide →</a>
        </div>
    `;
}

function toggleTheme() {
    const html = document.documentElement;
    const theme = html.getAttribute('data-theme');
    html.setAttribute('data-theme', theme === 'dark' ? 'light' : 'dark');
    localStorage.setItem('theme', html.getAttribute('data-theme'));
}

window.addEventListener('load', () => {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    const select1 = document.getElementById('role1');
    const select2 = document.getElementById('role2');
    Object.keys(roles).forEach(k => {
        select1.innerHTML += `<option value="${k}">${roles[k].title}</option>`;
        select2.innerHTML += `<option value="${k}">${roles[k].title}</option>`;
    });
});
</script>

</body>
</html>
