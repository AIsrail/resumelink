<div class="r-section" style="margin-top: 3rem; border-top: 0.5px solid var(--border); padding-top: 2rem;">
  <div class="r-section-title">Similar Roles to Explore</div>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px;">
    {% assign category = page.category %}
    {% for role in site.roles %}
      {% if role.category == category and role.title != page.title %}
        <a href="{{ role.url }}" style="background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 14px; text-decoration: none; transition: all .2s; display: block;">
          <div style="font-size: 12px; color: var(--green-dk); text-transform: uppercase; margin-bottom: 6px;">{{ role.category }}</div>
          <div style="font-size: 13px; font-weight: 500; color: var(--forest); margin-bottom: 4px;">{{ role.title }}</div>
          <div style="font-size: 11px; color: var(--muted); line-height: 1.5;">{{ role.summary_hack | truncatewords: 12 }}</div>
        </a>
      {% endif %}
    {% endfor %}
  </div>
</div>
