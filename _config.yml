# ResumeLink — Jekyll Config
title: ResumeLink
description: AI-powered resume builder that converts PDF resumes into interactive profiles with ATS score, QR code and shareable link. Free, no signup required.
url: "https://resumelink.cc"
baseurl: ""

# Collections
collections:
  roles:
    output: true
    permalink: /roles/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "roles"
    values:
      layout: "role"

# Exclude from Jekyll processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Blog posts live under /blog/<slug>/ (the URLs already listed in sitemap and shared)
permalink: /blog/:title/

plugins:
  - jekyll-redirect-from

# sitemap.xml is generated from site.pages / site.roles / site.posts (see sitemap.xml)
