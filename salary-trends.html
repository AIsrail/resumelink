<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Salary Trends — Growth by Experience</title>
    <meta name="description" content="Interactive salary trends for AI roles: see how salaries grow from junior to director level.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --green: #1DB368; --forest: #0D3D28; --bg: #F2FAF6;
            --surface: #FFFFFF; --border: #C5E8D5; --text: #0D3D28; --muted: #5A8A70;
        }
        [data-theme="dark"] {
            --green: #2EE383; --forest: #E8F5F0; --bg: #0D3D28;
            --surface: #1A5F42; --border: #2E8A5F; --text: #E8F5F0; --muted: #A8D5BA;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .nav-logo { font-size: 20px; font-weight: 500; color: var(--forest); text-decoration: none; }
        .nav-logo span { color: var(--green); }
        .theme-toggle { background: none; border: none; font-size: 20px; cursor: pointer; }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        .subtitle { color: var(--muted); margin-bottom: 2rem; }
        .chart-container { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 2rem; position: relative; height: 400px; }
        .filter-roles { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 2rem; }
        .role-btn { padding: 8px 14px; border: 0.5px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; transition: all .2s; }
        .role-btn.active { background: var(--green); color: white; border-color: var(--green); }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .stat-card { background: var(--surface); border: 0.5px solid var(--border); padding: 20px; border-radius: 12px; }
        .stat-value { font-size: 24px; font-weight: 600; color: var(--green); }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 5px; }
    </style>
</head>
<body>

<nav>
    <a href="/" class="nav-logo">Resume<span>Link</span></a>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</nav>

<div class="container">
    <h1>AI Salary Trends 2026</h1>
    <p class="subtitle">Explore how salaries grow by experience level across AI roles</p>

    <div class="filter-roles" id="roleButtons"></div>

    <div class="chart-container">
        <canvas id="salaryChart"></canvas>
    </div>

    <div class="stats" id="stats"></div>
</div>

<script>
const salaryData = {
    engineer: { name: "AI Engineer", data: [80, 120, 160, 220, 280] },
    data: { name: "Data Scientist", data: [70, 110, 150, 200, 250] },
    business: { name: "AI Business Lead", data: [85, 130, 180, 260, 350] },
    security: { name: "AI Security Analyst", data: [75, 120, 160, 220, 280] },
    ethics: { name: "AI Ethics Officer", data: [65, 105, 140, 190, 260] },
};

const levels = ["Junior", "Mid-level", "Senior", "Lead", "Director"];
const colors = {
    engineer: "#1DB368",
    data: "#0D8A4E",
    business: "#0D3D28",
    security: "#2EE383",
    ethics: "#5A8A70",
};

let selectedRoles = ["engineer", "data"];
let chart = null;

function toggleRole(role) {
    if (selectedRoles.includes(role)) {
        selectedRoles = selectedRoles.filter(r => r !== role);
    } else {
        selectedRoles.push(role);
    }
    if (selectedRoles.length === 0) selectedRoles = [role];
    updateChart();
}

function updateChart() {
    document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.toggle('active', selectedRoles.includes(btn.dataset.role));
    });

    const datasets = selectedRoles.map(role => ({
        label: salaryData[role].name,
        data: salaryData[role].data,
        borderColor: colors[role],
        backgroundColor: colors[role] + "20",
        tension: 0.4,
        fill: true,
        pointRadius: 5,
        pointBackgroundColor: colors[role],
    }));

    const ctx = document.getElementById('salaryChart').getContext('2d');
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: levels,
            datasets: datasets,
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text').trim() },
                },
            },
            scales: {
                y: {
                    title: { display: true, text: "Salary ($k)" },
                    grid: { color: getComputedStyle(document.documentElement).getPropertyValue('--border').trim() },
                    ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() },
                    beginAtZero: true,
                    max: 400,
                },
                x: {
                    grid: { display: false },
                    ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() },
                },
            },
        },
    });

    updateStats();
}

function updateStats() {
    const role = selectedRoles[0];
    const data = salaryData[role].data;
    const avgGrowth = ((data[data.length-1] - data[0]) / data[0] * 100).toFixed(0);
    const midToDirector = ((data[4] - data[2]) / data[2] * 100).toFixed(0);

    document.getElementById('stats').innerHTML = `
        <div class="stat-card">
            <div class="stat-value">${data[0]}k</div>
            <div class="stat-label">Junior salary</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${data[4]}k</div>
            <div class="stat-label">Director salary</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">+${avgGrowth}%</div>
            <div class="stat-label">Career growth</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">+${midToDirector}%</div>
            <div class="stat-label">Senior to Director jump</div>
        </div>
    `;
}

function toggleTheme() {
    const html = document.documentElement;
    const theme = html.getAttribute('data-theme');
    html.setAttribute('data-theme', theme === 'dark' ? 'light' : 'dark');
    localStorage.setItem('theme', html.getAttribute('data-theme'));
}

window.addEventListener('load', () => {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    const btns = document.getElementById('roleButtons');
    Object.keys(salaryData).forEach(role => {
        const btn = document.createElement('button');
        btn.className = 'role-btn' + (selectedRoles.includes(role) ? ' active' : '');
        btn.textContent = salaryData[role].name;
        btn.dataset.role = role;
        btn.onclick = () => toggleRole(role);
        btns.appendChild(btn);
    });
    updateChart();
});
</script>

</body>
</html>
